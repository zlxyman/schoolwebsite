<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Susun Hanzi - Dark Mode Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        chinese: ['"Ma Shan Zheng"', 'cursive', 'sans-serif']
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden; 
            touch-action: none;
        }

        /* --- KERTAS MIZI GE (DARK MODE) --- */
        .mizi-ge {
            background-color: #1e293b;
            background-image:
                linear-gradient(to right, transparent 49.5%, rgba(148, 163, 184, 0.15) 49.5%, rgba(148, 163, 184, 0.15) 50.5%, transparent 50.5%),
                linear-gradient(to bottom, transparent 49.5%, rgba(148, 163, 184, 0.15) 49.5%, rgba(148, 163, 184, 0.15) 50.5%, transparent 50.5%),
                linear-gradient(45deg, transparent 49.5%, rgba(148, 163, 184, 0.08) 49.5%, rgba(148, 163, 184, 0.08) 50.5%, transparent 50.5%),
                linear-gradient(-45deg, transparent 49.5%, rgba(148, 163, 184, 0.08) 49.5%, rgba(148, 163, 184, 0.08) 50.5%, transparent 50.5%);
            background-size: 100% 100%;
        }

        /* --- ANIMASI & EFEK NEON --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px) rotate(-2deg); }
            75% { transform: translateX(6px) rotate(2deg); }
        }
        .shake-error {
            animation: shake 0.3s ease-in-out;
            background-color: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        @keyframes hanziPulseGlow {
            0% { opacity: 0.4; filter: drop-shadow(0 0 4px currentColor); }
            100% { opacity: 1; filter: drop-shadow(0 0 16px currentColor); }
        }
        .hint-glow {
            animation: hanziPulseGlow 0.8s infinite alternate ease-in-out;
        }

        /* --- TOMBOL GORESAN (NEUMORPHIC / GLASS) --- */
        .hanzi-stroke-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(51, 65, 85, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 1.25rem;
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer;
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 70px; height: 70px;
        }
        @media (min-width: 640px) { .hanzi-stroke-btn { width: 85px; height: 85px; border-radius: 1.5rem; } }
        @media (min-width: 1024px) { .hanzi-stroke-btn { width: 95px; height: 95px; } }
        
        .hanzi-stroke-btn:hover { 
            transform: translateY(-5px) scale(1.05); 
            border-color: #38bdf8; 
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25); 
        }
        .hanzi-stroke-btn:active { transform: translateY(0) scale(0.95); }
        .hanzi-stroke-btn.disabled { opacity: 0; pointer-events: none; transform: scale(0.5); }

        /* General Utilities */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .confetti-piece { position: absolute; opacity: 1; }
    </style>
</head>
<body class="w-screen h-[100dvh] flex flex-col relative font-sans">
    
    <!-- Background Decor (Glows) -->
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-600/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <!-- HEADER -->
    <header class="h-16 lg:h-20 flex justify-between items-center px-6 lg:px-10 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-xl z-20 shrink-0">
        <a href="games.html" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:bg-sky-500 hover:text-white transition-colors border border-slate-700 shadow-lg">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="text-xl lg:text-2xl font-black tracking-tight text-white">Hanzi<span class="text-sky-400">Master</span></h1>
        <div class="px-4 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-sky-400 font-bold text-sm shadow-[0_0_15px_rgba(56,189,248,0.15)] flex items-center gap-2" id="progress-indicator">
            <i class="fa-solid fa-layer-group"></i> 1/5
        </div>
    </header>

    <!-- START SCREEN FULL OVERLAY -->
    <div id="hanzi-start-screen" class="absolute inset-0 z-[60] flex flex-col items-center justify-center p-6 text-center bg-slate-900/95 backdrop-blur-sm transition-opacity duration-500">
        <div class="w-28 h-28 lg:w-36 lg:h-36 bg-sky-500/10 border border-sky-500/30 rounded-3xl rotate-12 flex items-center justify-center mb-8 shadow-[0_0_50px_rgba(56,189,248,0.2)]">
            <i class="fa-solid fa-pen-nib text-5xl lg:text-6xl text-sky-400 -rotate-12 animate-pulse"></i>
        </div>
        <h2 class="text-4xl lg:text-6xl font-black text-white mb-4 tracking-tight drop-shadow-lg">Susun <span class="text-sky-400">Hanzi!</span></h2>
        <p class="text-slate-400 mb-10 text-sm lg:text-lg font-medium leading-relaxed max-w-lg px-4">
            Pengalaman premium merakit aksara Mandarin. Perhatikan cahaya goresan yang muncul pada kanvas, lalu pilih bentuk yang tepat.
        </p>
        <button onclick="startHanziGame()" class="bg-sky-500 text-white font-extrabold px-10 lg:px-14 py-4 lg:py-5 rounded-2xl shadow-[0_0_30px_rgba(56,189,248,0.4)] hover:bg-sky-400 hover:-translate-y-1 hover:shadow-[0_0_40px_rgba(56,189,248,0.6)] active:translate-y-1 active:shadow-none transition-all text-lg lg:text-xl flex items-center gap-3">
            Mulai Bermain <i class="fa-solid fa-play"></i>
        </button>
    </div>

    <!-- MAIN SPLIT WORKSPACE -->
    <main id="hanzi-playing-area" class="flex-1 flex flex-col lg:flex-row w-full max-w-[1600px] mx-auto overflow-hidden hidden opacity-0 transition-opacity duration-500 z-10 relative">
        
        <!-- LEFT: CANVAS AREA -->
        <section class="w-full lg:w-3/5 h-[45dvh] lg:h-full flex flex-col items-center justify-center p-4 lg:p-10 relative shrink-0">
            <!-- Center decorative glow -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-sky-500/5 blur-[100px] rounded-full pointer-events-none"></div>

            <div class="text-center mb-4 lg:mb-8 z-10">
                <span class="inline-block py-1 px-4 rounded-full bg-slate-800 border border-slate-700 text-sky-400 text-[10px] lg:text-xs font-bold tracking-widest uppercase shadow-sm mb-2">
                    <i class="fa-solid fa-eye animate-pulse mr-1"></i> Perhatikan Goresan
                </span>
            </div>
            
            <!-- Mizi Ge Canvas -->
            <div class="relative w-full max-w-[260px] sm:max-w-[320px] lg:max-w-[450px] aspect-square group z-10">
                <div class="absolute inset-0 border-2 border-slate-700 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-0"></div>
                <div class="absolute inset-[2px] mizi-ge rounded-[22px] z-0"></div>
                
                <div id="hanzi-main-canvas" class="absolute inset-[2px] z-10"></div>
                <div id="hanzi-hint-overlay" class="absolute inset-[2px] pointer-events-none flex items-center justify-center z-20"></div>
            </div>
        </section>

        <!-- RIGHT/BOTTOM: CONTROLS AREA -->
        <section class="w-full lg:w-2/5 h-[55dvh] lg:h-full bg-slate-850/80 lg:border-l border-t lg:border-t-0 border-slate-800 flex flex-col p-6 lg:p-12 z-20 shadow-[0_-20px_50px_rgba(0,0,0,0.3)] lg:shadow-[-20px_0_50px_rgba(0,0,0,0.3)] backdrop-blur-md">
            
            <div class="mb-6 lg:mb-10 text-center lg:text-left shrink-0">
                <h2 class="text-xl lg:text-3xl font-bold text-white mb-2">Pilih Goresan <i class="fa-solid fa-wand-magic-sparkles text-sky-400 ml-2"></i></h2>
                <p class="text-slate-400 text-xs lg:text-sm">Temukan potongan bentuk yang tepat dari pilihan di bawah ini untuk melanjutkan aksara.</p>
            </div>
            
            <!-- Stroke Options Grid -->
            <div class="flex-1 overflow-y-auto hide-scrollbar pb-10 p-4 -m-4">
                <div id="hanzi-stroke-options" class="flex flex-wrap justify-center lg:justify-start gap-4 lg:gap-6">
                    <!-- Tombol goresan di-generate JS -->
                </div>
            </div>

        </section>
    </main>

    <!-- SUCCESS FULL SCREEN MODAL -->
    <div id="hanzi-success-area" class="fixed inset-0 z-[70] bg-slate-950/90 backdrop-blur-xl flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-500">
        <div id="confetti-canvas" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
        
        <div class="bg-slate-900 border border-slate-700/50 rounded-[2.5rem] p-8 lg:p-14 shadow-[0_0_80px_rgba(56,189,248,0.15)] max-w-lg w-full mx-4 text-center relative overflow-hidden transform scale-95 transition-transform duration-500" id="success-card">
            <!-- Glow behind character -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[200px] h-[200px] bg-sky-500/20 blur-[80px] rounded-full pointer-events-none"></div>

            <div class="relative z-10">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-6"><i class="fa-solid fa-check-circle text-emerald-400 mr-1"></i> Karakter Selesai!</h3>
                
                <div class="flex items-end justify-center gap-4 mb-4">
                    <div class="w-[96px] h-[96px] lg:w-[128px] lg:h-[128px] drop-shadow-[0_0_20px_rgba(255,255,255,0.4)]" id="hanzi-result-char"></div>
                    <div class="text-3xl lg:text-4xl text-sky-400 font-black mb-2 lg:mb-4" id="hanzi-result-pinyin"></div>
                </div>
                
                <div class="inline-block bg-slate-800/80 border border-slate-700 px-8 py-3 rounded-full text-lg lg:text-xl text-slate-200 font-bold mb-10 shadow-inner" id="hanzi-result-meaning"></div>

                <button id="hanzi-next-btn" onclick="nextHanziWord()" class="bg-white text-slate-900 font-black px-8 py-4 lg:py-5 rounded-2xl shadow-[0_0_30px_rgba(255,255,255,0.2)] hover:bg-slate-200 hover:-translate-y-1 transition-all w-full flex items-center justify-center gap-3 text-lg">
                    Lanjut Kata Berikutnya <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- AUDIO FILES -->
    <audio id="sfx-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
    <audio id="sfx-wrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" preload="auto"></audio>
    <audio id="sfx-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>

    <script>
        // --- DATA HANZI ---
        const hanziQuestions = [
            { char: '星', pinyin: 'Xīng', meaning: 'Bintang' },
            { char: '爱', pinyin: 'Ài', meaning: 'Cinta / Kasih Sayang' },
            { char: '学', pinyin: 'Xué', meaning: 'Belajar' },
            { char: '师', pinyin: 'Shī', meaning: 'Guru' },
            { char: '友', pinyin: 'Yǒu', meaning: 'Teman' }
        ];

        // Palet warna NEON untuk goresan
        const strokeColors = [
            '#38bdf8', '#a78bfa', '#f472b6', '#fbbf24', '#34d399', 
            '#f87171', '#60a5fa', '#c084fc', '#818cf8', '#2dd4bf'
        ];
        // Warna magic untuk hook CSS (Warna background canvas agar awalnya tak terlihat)
        const magicColor = '#123456';

        let currentQuestionIndex = 0;
        let mainWriter = null;
        let expectedStroke = 0;
        let totalStrokes = 0;
        let charStrokeData = [];

        function playSound(id) {
            const audio = document.getElementById(id);
            if(audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio blocked'));
            }
        }

        async function buildHanziGame() {
            const q = hanziQuestions[currentQuestionIndex];
            const mainTarget = document.getElementById('hanzi-main-canvas');
            const hintContainer = document.getElementById('hanzi-hint-overlay');
            const optionsContainer = document.getElementById('hanzi-stroke-options');
            const successArea = document.getElementById('hanzi-success-area');
            const playingArea = document.getElementById('hanzi-playing-area');
            const startScreen = document.getElementById('hanzi-start-screen');
            const progressIndicator = document.getElementById('progress-indicator');
            const successCard = document.getElementById('success-card');

            if (!mainTarget || typeof HanziWriter === 'undefined') return;

            expectedStroke = 0;
            optionsContainer.innerHTML = '';
            hintContainer.innerHTML = '';
            mainTarget.innerHTML = '';
            
            // Tutup Modal Sukses
            successArea.style.opacity = '0';
            setTimeout(() => {
                successArea.classList.add('hidden'); 
                successArea.classList.remove('flex');
                successCard.classList.remove('scale-100');
                successCard.classList.add('scale-95');
            }, 500);
            
            // Buka Area Bermain
            playingArea.classList.remove('hidden');
            playingArea.classList.add('flex');
            setTimeout(() => { playingArea.style.opacity = '1'; }, 50);
            
            // Tutup Layar Awal
            if (startScreen && !startScreen.classList.contains('hidden')) { 
                startScreen.style.opacity = '0';
                setTimeout(() => {
                    startScreen.classList.add('hidden'); 
                    startScreen.classList.remove('flex');
                }, 500);
            }

            if (progressIndicator) {
                progressIndicator.innerHTML = `<i class="fa-solid fa-layer-group"></i> ${currentQuestionIndex + 1}/${hanziQuestions.length}`;
            }

            // Inisialisasi HanziWriter (Dark Mode Config)
            mainWriter = HanziWriter.create('hanzi-main-canvas', q.char, {
                width: mainTarget.clientWidth || 250,
                height: mainTarget.clientHeight || 250,
                padding: 24,
                strokeColor: '#ffffff',
                showOutline: true,
                outlineColor: '#334155', // Warna outline abu-gelap
                showCharacter: false,
                strokeAnimationSpeed: 2,
            });

            try {
                // Ambil data karakter mentah (path SVG)
                const charData = await HanziWriter.loadCharacterData(q.char);
                charStrokeData = charData.strokes;
                totalStrokes = charStrokeData.length;

                generateStrokeButtons();
                showHint(expectedStroke);
            } catch (error) {
                console.error('Gagal memuat karakter:', error);
            }
        }

        // Tampilkan goresan bantuan yang berkedip
        function showHint(index) {
            const hintContainer = document.getElementById('hanzi-hint-overlay');
            if (!hintContainer) return;
            if (index >= totalStrokes) { hintContainer.innerHTML = ''; return; }

            const color = strokeColors[index % strokeColors.length];
            hintContainer.innerHTML = `
                <svg viewBox="0 0 1024 1024" class="w-full h-full p-[24px]" style="color:${color}">
                    <g transform="scale(1, -1) translate(0, -900)">
                        <path d="${charStrokeData[index]}" fill="${color}" class="hint-glow"></path>
                    </g>
                </svg>
            `;
        }

        // Buat kotak-kotak opsi bentuk goresan (diacak)
        function generateStrokeButtons() {
            const optionsContainer = document.getElementById('hanzi-stroke-options');
            if (!optionsContainer) return;
            optionsContainer.innerHTML = '';

            let indices = [];
            for (let i = 0; i < totalStrokes; i++) indices.push(i);
            // Acak urutan tombol
            indices.sort(() => Math.random() - 0.5);

            indices.forEach(index => {
                const btn = document.createElement('button');
                btn.className = 'hanzi-stroke-btn';
                const color = strokeColors[index % strokeColors.length];
                
                // Masukkan SVG path
                btn.innerHTML = `
                    <svg viewBox="0 0 1024 1024" class="w-12 h-12 lg:w-16 lg:h-16">
                        <g transform="scale(1, -1) translate(0, -900)">
                            <path d="${charStrokeData[index]}" fill="${color}" filter="drop-shadow(0 0 3px ${color})"></path>
                        </g>
                    </svg>
                `;
                optionsContainer.appendChild(btn);
                btn.addEventListener('click', () => handleStrokeClick(btn, index));
            });
        }

        function handleStrokeClick(buttonElement, clickedIndex) {
            // Jika benar
            if (clickedIndex === expectedStroke) {
                playSound('sfx-correct');
                const hintContainer = document.getElementById('hanzi-hint-overlay');
                if (hintContainer) hintContainer.innerHTML = '';

                buttonElement.classList.add('disabled');

                mainWriter.animateStroke(expectedStroke, {
                    onComplete: () => {
                        expectedStroke++;
                        if (expectedStroke === totalStrokes) {
                            setTimeout(showSuccess, 500);
                        } else {
                            showHint(expectedStroke);
                        }
                    }
                });
            } else {
                // Jika salah
                playSound('sfx-wrong');
                buttonElement.classList.add('shake-error');
                setTimeout(() => {
                    buttonElement.classList.remove('shake-error');
                }, 300);
            }
        }

        function showSuccess() {
            playSound('sfx-win');
            fireConfetti();
            
            const q = hanziQuestions[currentQuestionIndex];
            const successArea = document.getElementById('hanzi-success-area');
            const successCard = document.getElementById('success-card');
            
            if (successArea) { 
                successArea.classList.remove('hidden'); 
                successArea.classList.add('flex');
                setTimeout(() => {
                    successArea.style.opacity = '1';
                    successCard.classList.remove('scale-95');
                    successCard.classList.add('scale-100');
                }, 50);
            }

            const resultChar = document.getElementById('hanzi-result-char');
            resultChar.innerHTML = '';
            
            const size = window.innerWidth >= 1024 ? 128 : 96;
            HanziWriter.create('hanzi-result-char', q.char, {
                width: size,
                height: size,
                padding: 0,
                strokeColor: '#ffffff',
                showOutline: false,
                showCharacter: true
            });
            
            document.getElementById('hanzi-result-pinyin').textContent = q.pinyin;
            document.getElementById('hanzi-result-meaning').textContent = q.meaning;

            const nextBtn = document.getElementById('hanzi-next-btn');
            const isLast = currentQuestionIndex >= hanziQuestions.length - 1;
            
            if(isLast) {
                nextBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Main Lagi dari Awal';
            } else {
                nextBtn.innerHTML = 'Lanjut Kata Berikutnya <i class="fa-solid fa-arrow-right"></i>';
            }
        }

        function nextHanziWord() {
            playSound('sfx-click');
            if (currentQuestionIndex >= hanziQuestions.length - 1) {
                currentQuestionIndex = 0;
            } else {
                currentQuestionIndex++;
            }
            buildHanziGame();
        }

        function startHanziGame() {
            playSound('sfx-click');
            currentQuestionIndex = 0;
            buildHanziGame();
        }

        function fireConfetti() {
            const container = document.getElementById('confetti-canvas');
            if(!container) return;
            container.innerHTML = '';
            
            for(let i=0; i<60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.width = Math.random() * 8 + 4 + 'px';
                confetti.style.height = Math.random() * 8 + 4 + 'px';
                confetti.style.backgroundColor = strokeColors[Math.floor(Math.random() * strokeColors.length)];
                confetti.style.left = '50%';
                confetti.style.top = '50%';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.boxShadow = `0 0 10px ${confetti.style.backgroundColor}`; // Neon glow
                
                const tx = (Math.random() - 0.5) * 600;
                const ty = (Math.random() - 0.5) * 600 - 100;
                const rot = Math.random() * 360;
                
                confetti.animate([
                    { transform: 'translate(-50%, -50%) scale(0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.5) rotate(${rot}deg)`, opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty + 200}px)) scale(1) rotate(${rot + 180}deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 1500,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                    fill: 'forwards'
                });
                
                container.appendChild(confetti);
            }
        }

        // Handle resize
        window.addEventListener('resize', () => {
            if (mainWriter) {
                const canvas = document.getElementById('hanzi-main-canvas');
                if (canvas && canvas.clientWidth > 0) {
                    mainWriter.updateDimensions({
                        width: canvas.clientWidth,
                        height: canvas.clientHeight
                    });
                }
            }
        });
    </script>
</body>
</html>
