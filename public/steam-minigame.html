<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTRO LOGIC - 3D Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/steam-minigame.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <!-- Top Container: Navigasi, Judul, dan Panduan Slot Panah (SELALU MUNCUL DI ATAS) -->
        <div class="top-container">
            <!-- Baris Navigasi -->
            <div class="w-full flex justify-between items-center pointer-events-auto px-1 sm:px-2">
                <a href="games.html" class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-md flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/25 transition-all border border-white/20 shadow-md" title="Kembali ke Portal Games">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <a href="steam.html" class="text-xs font-bold text-cyan-300 bg-cyan-950/70 border border-cyan-500/40 px-3 py-2 rounded-full hover:bg-cyan-900/80 transition-all flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-flask text-yellow-400"></i> <span class="hidden sm:inline">Program</span> STEAM
                </a>
            </div>

            <!-- Panduan Panah Langkah (Slot Panel) di Bagian Atas -->
            <div class="pointer-events-auto flex flex-col items-center">
                <div id="slot-panel" class="slot-panel">
                    <!-- Dynamically Generated Slots -->
                </div>
                <div id="slot-instruction" class="text-[11px] sm:text-xs text-cyan-200/90 font-semibold mt-1 tracking-wide text-center drop-shadow-sm">
                    Tekan tombol panah di bawah untuk mengisi rute langkah astronot
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div id="bottom-controls" class="gamepad-console">
            <!-- D-Pad -->
            <div class="grid grid-cols-3 gap-2 sm:gap-3 shrink-0">
                <div></div>
                <button class="ctrl-btn" data-dir="up"><i class="fa-solid fa-arrow-up"></i></button>
                <div></div>
                <button class="ctrl-btn" data-dir="left"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="ctrl-btn" data-dir="down"><i class="fa-solid fa-arrow-down"></i></button>
                <button class="ctrl-btn" data-dir="right"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            
            <!-- Actions -->
            <div class="flex flex-col gap-2 h-full items-center shrink-0 ml-2">
                <div class="flex gap-2 items-center">
                    <button class="ctrl-btn btn-undo" id="btn-undo"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="btn-go" id="btn-go">JALAN!</button>
                </div>
                <div id="level-indicator" class="text-lg text-[#00f3ff] font-black tracking-widest drop-shadow-[0_0_8px_rgba(0,243,255,0.8)]">LEVEL 1 / 5</div>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal-overlay">
        <div class="modal-box">
            <i class="fa-solid fa-medal text-6xl text-yellow-400 mb-4 drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]"></i>
            <h2 id="win-title" class="text-3xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-green-400">LEVEL SELESAI!</h2>
            <p id="win-desc" class="text-gray-300 font-medium mb-6">
                Logika komputasi kamu sangat tajam. Astronot berhasil mencapai titik tujuan!
            </p>
            <div class="flex flex-col gap-3">
                <button id="btn-next-level" class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-white font-bold py-4 rounded-xl text-xl hover:scale-105 transition-transform shadow-[0_0_20px_rgba(0,243,255,0.4)]">
                    LANJUT LEVEL
                </button>
                <button id="btn-replay-level" class="w-full bg-transparent border-2 border-cyan-500 text-cyan-400 font-bold py-3 rounded-xl text-lg hover:bg-cyan-900/30 transition-colors">
                    ULANGI LEVEL INI
                </button>
            </div>
        </div>
    </div>

    <!-- Lose Modal -->
    <div id="lose-modal" class="modal-overlay">
        <div class="modal-box lose">
            <i class="fa-solid fa-meteor text-6xl text-red-500 mb-4 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]"></i>
            <h2 class="text-3xl font-black mb-2 text-red-400">JATUH KE LUBANG!</h2>
            <p class="text-gray-300 font-medium mb-6">
                Rute instruksi kamu salah dan astronot tergelincir ke ruang angkasa. Susun ulang logikamu!
            </p>
            <div class="flex flex-col gap-3">
                <button id="btn-retry-level" class="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-4 rounded-xl text-xl hover:scale-105 transition-transform shadow-[0_0_20px_rgba(239,68,68,0.4)]">
                    COBA LAGI
                </button>
                <button id="btn-back-home" class="w-full bg-transparent border-2 border-red-500 text-red-400 font-bold py-3 rounded-xl text-lg hover:bg-red-900/30 transition-colors">
                    KEMBALI KE AWAL
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/steam-minigame.js"></script>
</body>
</html>
